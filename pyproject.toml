[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsupport"
version = "0.1.0"
description = "Auto-orient any STL and generate resin-style supports dimensioned for FDM printing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
    "trimesh>=4.0",
    "shapely>=2.0",
    # trimesh needs these for scene handling and reading 3MF back. Deliberately
    # NOT rtree/embree — see CLAUDE.md.
    "networkx>=3.0",
    "lxml>=5.0",
    "mapbox-earcut>=1.0",  # trimesh's polygon triangulation engine
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]  # httpx backs fastapi's TestClient

[project.scripts]
rsupport = "rsupport.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rsupport = ["web/static/*", "web/static/samples/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
