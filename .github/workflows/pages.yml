# Publish the client-side build to GitHub Pages.
#
# The bundle scripts/build_web.py produces needs no server of its own, so
# "deploying" is just putting those files somewhere. Pages is the cheapest
# somewhere: no CPU per user, no upload of anyone's model, and nothing to
# keep running.
#
# Pages has one setting this workflow cannot set for itself: the *source*
# must be "GitHub Actions", not "Deploy from a branch". CI is not allowed to
# change it (see the step below), so it is a one-time click in Settings -> Pages
# - and on a branch source the site serves a Jekyll rendering of README.md
# instead of the app, however green this workflow is. The last step of the
# deploy job is what catches that.

name: pages

on:
  push:
    # `feat/pipeline-foundation` is this repo's **default branch** and what
    # everything merges into — there is no `main`, despite what the git rules
    # in CLAUDE.md call it. Publishing is wired to the branch that actually
    # exists; `main` is listed too so this keeps working if one is ever made.
    branches: [feat/pipeline-foundation, main]
  # Only offered by GitHub for workflows on the default branch, so this becomes
  # available once this file is merged there.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one halfway: an interrupted deploy can
# leave the site serving a half-written bundle.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Ask for the Pages *source* to be this workflow rather than a branch.
      #
      # Why this matters: on a branch source GitHub generates its own built-in
      # "pages build and deployment" run on every push, builds README.md with
      # Jekyll, and deploys that to the same site. Two publishers, one URL, and
      # Jekyll's run usually lands a second or two after ours — which is how the
      # site served the README for weeks while every run here went green.
      #
      # Why it is only an attempt: GITHUB_TOKEN cannot change Pages settings.
      # Its `pages: write` covers *deployments*; the settings endpoints answer
      # 403 "Resource not accessible by integration" to it, and
      # `actions/configure-pages`' `enablement: true` hits the same wall (it
      # also only ever *creates* a site — it will not move an existing one off a
      # branch). So this needs either a hand on Settings -> Pages -> Source, or
      # a PAT with repo admin rights in the PAGES_SOURCE_TOKEN secret. Both are
      # one-time; the source stays where it is put.
      #
      # Failing the build here would only stop the deploy that is about to
      # correct the site, so this warns instead. The step that actually holds
      # the line is "Check the site serves the app" at the end of the deploy
      # job: it fails if the README is what came back.
      - name: Point Pages at this workflow, not at a branch
        env:
          GH_TOKEN: ${{ secrets.PAGES_SOURCE_TOKEN || github.token }}
        run: |
          set -u
          err="$RUNNER_TEMP/pages-source.err"
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null)" = workflow ]; then
            echo "Pages source is already this workflow."
            exit 0
          fi
          # PUT updates a site that exists; POST covers a repo where Pages has
          # never been turned on, where PUT answers 404.
          if gh api -X PUT "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow 2>"$err"; then
            echo "Pages source set to this workflow."
            exit 0
          fi
          if gh api -X POST "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow 2>>"$err"; then
            echo "Pages enabled, with this workflow as its source."
            exit 0
          fi
          sed 's/^/  /' "$err"
          echo "::warning title=Pages source not set from CI::The site may serve README.md instead of the app - see this step's log."
          cat <<'EOF'

          Could not set the Pages source from CI (the 403 above is expected with
          GITHUB_TOKEN - it is not allowed to change Pages settings).

          Fix it once, either way:
            * Settings -> Pages -> Build and deployment -> Source: GitHub Actions
            * or add a PAT with repo admin rights as the PAGES_SOURCE_TOKEN secret

          Until then GitHub keeps building README.md with Jekyll on every push and
          racing this workflow to publish it. The check at the end of the deploy
          job will fail if that is what wins.
          EOF

      - uses: actions/configure-pages@v5

      - uses: actions/setup-python@v5
        with:
          # 3.12 for the same reason the Dockerfile pins it: every dependency
          # has a cp312 manylinux wheel, so nothing has to be compiled here.
          python-version: '3.12'
          cache: pip

      - name: Install
        run: pip install -e .[dev]

      - name: Check the bundle before publishing it
        # Every way build_web.py can go wrong is silent. A bundle whose
        # config.js still says 'http' loads perfectly and then fails every
        # request against an API that is not there, so it is worth a few
        # seconds to find that here rather than in someone's browser.
        run: pytest tests/test_build_web.py tests/test_browser.py

      - name: Build
        run: python scripts/build_web.py dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # A green deploy is not evidence that the site serves the app: for months
      # every deploy here succeeded while the URL returned Jekyll's README. So
      # ask the site what it is actually serving, and fail loudly if it is the
      # docs. Two probes, because either alone can mislead — the marker file
      # exists only in our bundle, and the generator tag exists only in
      # Jekyll's output.
      - name: Check the site serves the app, not the README
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -u
          for attempt in 1 2 3 4 5 6; do
            [ "$attempt" -gt 1 ] && sleep 20
            root=$(curl -fsS --max-time 30 "$URL" || true)
            config=$(curl -fsS --max-time 30 "${URL%/}/config.js" || true)
            case "$root" in *'content="Jekyll'*)
              echo "attempt $attempt: still the Jekyll build of README.md"; continue;;
            esac
            case "$config" in *RSUPPORT_TRANSPORT*)
              echo "$URL is serving the app"; exit 0;;
            esac
            echo "attempt $attempt: no config.js yet at $URL"
          done
          echo "::error::$URL is not serving the bundle this workflow just built."
          cat <<'EOF'

          If the root came back as Jekyll's README, the Pages source is a branch
          rather than this workflow, and GitHub's own Jekyll run beat us to the
          site. Nothing in CI can change that setting - see the "Point Pages at
          this workflow" step in the build job. Fix it once:

            Settings -> Pages -> Build and deployment -> Source: GitHub Actions

          then re-run this workflow. Immediately after switching, one last
          in-flight Jekyll run can still land after ours; a re-run settles it.
          EOF
          exit 1
