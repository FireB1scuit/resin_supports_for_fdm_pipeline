# Publish the client-side build to GitHub Pages.
#
# The bundle scripts/build_web.py produces needs no server of its own, so
# "deploying" is just putting those files somewhere. Pages is the cheapest
# somewhere: no CPU per user, no upload of anyone's model, and nothing to
# keep running.
#
# The build job points Pages at this workflow itself, so there is nothing to
# click in Settings. If that step is ever removed, the repo falls back to
# "Deploy from a branch" and Pages serves a Jekyll rendering of README.md
# instead of the app.

name: pages

on:
  push:
    # `feat/pipeline-foundation` is this repo's **default branch** and what
    # everything merges into — there is no `main`, despite what the git rules
    # in CLAUDE.md call it. Publishing is wired to the branch that actually
    # exists; `main` is listed too so this keeps working if one is ever made.
    branches: [feat/pipeline-foundation, main]
  # Only offered by GitHub for workflows on the default branch, so this becomes
  # available once this file is merged there.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one halfway: an interrupted deploy can
# leave the site serving a half-written bundle.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Set the Pages *source* to this workflow, every run.
      #
      # This is deliberately a raw API call and not `configure-pages`'
      # `enablement: true`. That option only *creates* a site when none exists;
      # against a repo whose Pages is already on "Deploy from a branch" it logs
      # that the site exists and moves on, leaving the branch source in place.
      # The symptom is nasty: GitHub keeps running its own built-in
      # "pages build and deployment" workflow for the branch source, Jekyll
      # renders README.md, and *both* pipelines deploy on every push. Whichever
      # finishes last wins, and Jekyll's Docker build usually beats ours by a
      # second or two — so the site served the README while this workflow went
      # green on every run.
      #
      # PUT updates an existing site; the POST covers a repo where Pages has
      # never been turned on (PUT 404s there). Once the source is "workflow"
      # GitHub stops generating the Jekyll run, so the race disappears rather
      # than being won.
      - name: Point Pages at this workflow, not at a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow \
            || gh api -X POST "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow

      - uses: actions/configure-pages@v5

      - uses: actions/setup-python@v5
        with:
          # 3.12 for the same reason the Dockerfile pins it: every dependency
          # has a cp312 manylinux wheel, so nothing has to be compiled here.
          python-version: '3.12'
          cache: pip

      - name: Install
        run: pip install -e .[dev]

      - name: Check the bundle before publishing it
        # Every way build_web.py can go wrong is silent. A bundle whose
        # config.js still says 'http' loads perfectly and then fails every
        # request against an API that is not there, so it is worth a few
        # seconds to find that here rather than in someone's browser.
        run: pytest tests/test_build_web.py tests/test_browser.py

      - name: Build
        run: python scripts/build_web.py dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # A green deploy is not evidence that the site serves the app: for months
      # every deploy here succeeded while the URL returned Jekyll's README. So
      # ask the site what it is actually serving, and fail loudly if it is the
      # docs. Two probes, because either alone can mislead — the marker file
      # exists only in our bundle, and the generator tag exists only in
      # Jekyll's output.
      - name: Check the site serves the app, not the README
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -u
          for attempt in 1 2 3 4 5 6; do
            [ "$attempt" -gt 1 ] && sleep 20
            root=$(curl -fsS --max-time 30 "$URL" || true)
            config=$(curl -fsS --max-time 30 "${URL%/}/config.js" || true)
            case "$root" in *'content="Jekyll'*)
              echo "attempt $attempt: still the Jekyll build of README.md"; continue;;
            esac
            case "$config" in *RSUPPORT_TRANSPORT*)
              echo "$URL is serving the app"; exit 0;;
            esac
            echo "attempt $attempt: no config.js yet at $URL"
          done
          echo "::error::$URL is not serving the bundle this workflow just built."
          echo "If the root is Jekyll's README, the Pages source reverted to a branch:"
          echo "check Settings -> Pages, and that the 'Point Pages at this workflow'"
          echo "step above still runs. A one-off failure right after the source is"
          echo "switched can also be an in-flight Jekyll run landing last — re-run"
          echo "this workflow, and it should stay fixed."
          exit 1
